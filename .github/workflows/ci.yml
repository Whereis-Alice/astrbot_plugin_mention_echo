name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install check-only deps
        run: python -m pip install --quiet pyyaml

      - name: Compile all sources
        run: python -m compileall -q main.py modules tests

      - name: Validate metadata / schema / changelog
        run: python .github/scripts/validate_manifest.py

      - name: Run maintenance tests
        run: python tests/test_maintenance.py

      - name: Run storage tests
        run: python tests/test_storage.py

      - name: Run query tests
        run: python tests/test_query.py